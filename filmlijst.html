<title>Ma Liste de Films</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : une colonne comme un programme de cinéma, la recherche en haut, puis ta liste en tickets à bord perforé */
:root {
  --bg: #eef0f4;
  --surface: #ffffff;
  --ink: #181c26;
  --muted: #5c6376;
  --line: #d6dae3;
  --accent: #0e6a6a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefee;
  --seen: #b8650a;
  --seen-soft: #fbecd8;
  --danger: #b42318;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b2029; --ink: #e9ecf2; --muted: #9aa2b4; --line: #2d3442;
    --accent: #4fc1bd; --accent-ink: #0c1a1a; --accent-soft: #173534;
    --seen: #f0a24a; --seen-soft: #3a2a17; --danger: #f2877d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b2029; --ink: #e9ecf2; --muted: #9aa2b4; --line: #2d3442;
  --accent: #4fc1bd; --accent-ink: #0c1a1a; --accent-soft: #173534;
  --seen: #f0a24a; --seen-soft: #3a2a17; --danger: #f2877d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 820px; margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px;
}
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 700; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.tally { display: flex; gap: 20px; }
.tally div { display: grid; }
.tally b { font-family: var(--f-mono); font-size: 26px; font-weight: 500; line-height: 1.1; }
.tally .seen b { color: var(--seen); }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.search { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.search form { display: flex; gap: 8px; }
.search input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
}
.btn { border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.status { font-size: 14px; color: var(--muted); margin: 0; }
.status.err { color: var(--danger); }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px dashed var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; }

.results { display: grid; gap: 8px; }
.result {
  display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  padding: 12px; border-radius: 8px; background: var(--bg);
}
.result > div { min-width: 0; }
.result .t { font-weight: 600; }
.result .meta { font-size: 13px; color: var(--muted); }
.result .syn { font-size: 13px; margin-top: 4px; }
.onlist { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }

.listhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.list { display: grid; gap: 10px; }
.film {
  position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 16px 14px;
}
.film::before { /* perforation, comme un ticket de cinéma */
  content: ""; position: absolute; left: 52px; top: 10px; bottom: 10px;
  border-left: 2px dotted var(--line);
}
.film > div { min-width: 0; }
.check {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: transparent;
  display: grid; place-items: center; padding: 0; margin-top: 2px; color: transparent;
}
.check svg { width: 14px; height: 14px; }
.film.seen .check { background: var(--seen); border-color: var(--seen); color: var(--surface); }
.film .body { padding-left: 14px; display: grid; gap: 6px; }
.film .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.film .title { font-family: var(--f-display); font-size: 19px; font-weight: 700; line-height: 1.2; }
.film.seen .title { color: var(--muted); }
.film .year { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.stamp { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--seen); background: var(--seen-soft); padding: 2px 8px; border-radius: 4px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.facts span b { color: var(--ink); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); }
.syn { margin: 0; max-width: 65ch; }
.actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; }
.actions a { color: var(--accent); }
.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; }
.link.danger { color: var(--danger); }

.empty { text-align: left; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 6px; }
.empty p { margin: 0; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .film { transition: border-color .2s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">Liste de films personnelle</div>
      <h1>Ma Liste de Films</h1>
    </div>
    <div class="tally">
      <div><b id="nTodo">0</b><span class="label">À voir</span></div>
      <div class="seen"><b id="nSeen">0</b><span class="label">Vus</span></div>
    </div>
  </header>

  <section class="search" id="searchBox" aria-label="Rechercher un film">
    <form id="searchForm">
      <input id="q" type="search" placeholder="Cherche un film, par ex. Le Parrain" autocomplete="off" aria-label="Titre du film">
      <button class="btn" id="searchBtn" type="submit">Chercher</button>
    </form>
    <div class="suggest" id="suggest">
      <span class="hint">Essaie :</span>
      <button type="button">Interstellar</button>
      <button type="button">Amélie</button>
      <button type="button">Intouchables</button>
      <button type="button">Parasite</button>
    </div>
    <p class="status" id="searchStatus" hidden></p>
    <div class="results" id="results"></div>
    <p class="hint">Seuls les films qui existent vraiment s'affichent. Claude les recherche et ajoute l'année, la réalisation, les acteurs, le genre et un court résumé. Les films très récents peuvent manquer.</p>
  </section>

  <section style="display:grid;gap:12px" aria-label="Ta liste">
    <div class="listhead">
      <h2>Ta liste</h2>
      <div class="tabs" role="group" aria-label="Filtrer">
        <button type="button" data-f="todo" aria-pressed="true">À voir</button>
        <button type="button" data-f="seen" aria-pressed="false">Vus</button>
        <button type="button" data-f="all" aria-pressed="false">Tous</button>
      </div>
    </div>
    <p class="status" id="listStatus">Chargement de ta liste…</p>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

let db = null, sample = null, canWrite = true;
let films = [];            // {id, ...données}
let results = [];
let filter = "todo";
let confirmId = null;
try { filter = localStorage.getItem("filmFilter") || "todo"; } catch (e) {}

function slug(title, year) {
  const base = String(title).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 80) || "film";
  return base + "-" + (Number(year) || "x");
}
function imdbLink(f) {
  return f.imdbId && /^tt\d{6,9}$/.test(f.imdbId)
    ? "https://www.imdb.com/title/" + f.imdbId + "/"
    : "https://www.imdb.com/find/?q=" + encodeURIComponent(f.title + " " + (f.year || ""));
}

/* ---------- liste ---------- */
function renderTabs() {
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
}
function renderList() {
  const seen = films.filter((f) => f.watched), todo = films.filter((f) => !f.watched);
  $("#nTodo").textContent = todo.length;
  $("#nSeen").textContent = seen.length;
  let shown = filter === "seen" ? seen : filter === "todo" ? todo : [...todo, ...seen];
  shown = shown.slice().sort((a, b) =>
    a.watched !== b.watched ? (a.watched ? 1 : -1)
      : a.watched ? (b.watchedAt || 0) - (a.watchedAt || 0) : (b.addedAt || 0) - (a.addedAt || 0));
  const list = $("#list");
  if (!films.length) {
    list.innerHTML = `<div class="empty"><h2>Pas encore de films</h2><p>Cherche un film ci-dessus et clique sur <b>Ajouter</b>. Coche-le dès que tu l'as vu.</p></div>`;
    return;
  }
  if (!shown.length) {
    list.innerHTML = `<div class="empty"><p>${filter === "seen" ? "Tu n'as encore rien coché." : "Tout est vu. Il est temps de chercher de nouveaux films."}</p></div>`;
    return;
  }
  list.innerHTML = shown.map((f) => `
    <article class="film${f.watched ? " seen" : ""}" data-id="${esc(f.id)}">
      <button class="check" data-act="toggle" aria-pressed="${!!f.watched}" ${canWrite ? "" : "disabled"}
        aria-label="${f.watched ? "Marquer comme non vu" : "Marquer comme vu"}: ${esc(f.title)}">${CHECK}</button>
      <div class="body">
        <div class="top">
          <span class="title">${esc(f.title)}</span>
          <span class="year">${esc(f.year || "")}</span>
          ${f.watched ? `<span class="stamp">Vu${f.watchedAt ? " le " + new Date(f.watchedAt).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }) : ""}</span>` : ""}
        </div>
        ${f.originalTitle && f.originalTitle !== f.title ? `<div class="hint">${esc(f.originalTitle)}</div>` : ""}
        <div class="facts">
          ${f.director ? `<span>Réalisation <b>${esc(f.director)}</b></span>` : ""}
          ${f.runtime ? `<span class="mono">${esc(f.runtime)} min</span>` : ""}
          ${f.country ? `<span>${esc(f.country)}</span>` : ""}
        </div>
        ${Array.isArray(f.genres) && f.genres.length ? `<div class="chips">${f.genres.map((g) => `<span class="chip">${esc(g)}</span>`).join("")}</div>` : ""}
        ${f.synopsis ? `<p class="syn">${esc(f.synopsis)}</p>` : ""}
        ${Array.isArray(f.cast) && f.cast.length ? `<div class="facts"><span>Avec <b>${f.cast.map(esc).join(", ")}</b></span></div>` : ""}
        <div class="actions">
          <a href="${esc(imdbLink(f))}" target="_blank" rel="noopener">Voir sur IMDb</a>
          ${canWrite ? (confirmId === f.id
            ? `<span>Supprimer ?</span><button class="link danger" data-act="del">Oui, supprimer</button><button class="link" data-act="nodel">Annuler</button>`
            : `<button class="link" data-act="askdel">Supprimer</button>`) : ""}
        </div>
      </div>
    </article>`).join("");
}

$("#list").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-act]"); if (!btn) return;
  const id = btn.closest(".film").dataset.id;
  const f = films.find((x) => x.id === id); if (!f || !db) return;
  const act = btn.dataset.act;
  if (act === "askdel") { confirmId = id; renderList(); return; }
  if (act === "nodel") { confirmId = null; renderList(); return; }
  try {
    if (act === "del") { confirmId = null; await db.collection("movies").doc(id).delete(); }
    if (act === "toggle") {
      btn.disabled = true;
      await db.collection("movies").doc(id).update(f.watched ? { watched: false, watchedAt: null } : { watched: true, watchedAt: Date.now() });
    }
  } catch (err) { showListError(err); }
});

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f;
  try { localStorage.setItem("filmFilter", filter); } catch (e) {}
  renderTabs(); renderList();
});

function showListError(err) {
  const s = $("#listStatus"); s.hidden = false; s.classList.add("err");
  if (err && err.code === "invalid_argument") { canWrite = false; s.textContent = "Tu peux seulement consulter cette liste, pas la modifier."; renderList(); }
  else if (err && err.code === "quota_exceeded") s.textContent = "Ta liste est pleine. Supprime quelques films et réessaie.";
  else s.textContent = "L'enregistrement a échoué. Réessaie dans un instant.";
}

/* ---------- recherche ---------- */
function renderResults() {
  const box = $("#results");
  box.innerHTML = results.map((r, i) => {
    const on = films.some((f) => f.id === slug(r.title, r.year));
    return `<div class="result">
      <div>
        <div class="t">${esc(r.title)} <span class="mono" style="color:var(--muted);font-weight:400">${esc(r.year || "")}</span></div>
        <div class="meta">${[r.director && "Réalisation " + r.director, r.runtime && r.runtime + " min", Array.isArray(r.genres) && r.genres.slice(0, 3).join(", ")].filter(Boolean).map(esc).join(" · ")}</div>
        ${r.synopsis ? `<div class="syn">${esc(r.synopsis)}</div>` : ""}
      </div>
      ${on ? `<span class="onlist">Dans ta liste</span>` : `<button class="btn" data-i="${i}" ${canWrite && db ? "" : "disabled"}>Ajouter</button>`}
    </div>`;
  }).join("");
}

$("#results").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-i]"); if (!b || !db) return;
  const r = results[Number(b.dataset.i)]; if (!r) return;
  b.disabled = true; b.textContent = "Ajout…";
  const doc = {
    title: String(r.title).slice(0, 200),
    originalTitle: r.originalTitle ? String(r.originalTitle).slice(0, 200) : "",
    year: Number(r.year) || null,
    director: r.director ? String(r.director).slice(0, 200) : "",
    runtime: Number(r.runtime) || null,
    country: r.country ? String(r.country).slice(0, 100) : "",
    genres: Array.isArray(r.genres) ? r.genres.slice(0, 5).map(String) : [],
    cast: Array.isArray(r.cast) ? r.cast.slice(0, 4).map(String) : [],
    synopsis: r.synopsis ? String(r.synopsis).slice(0, 600) : "",
    imdbId: typeof r.imdbId === "string" ? r.imdbId : null,
    watched: false, watchedAt: null, addedAt: Date.now(),
  };
  try { await db.collection("movies").doc(slug(doc.title, doc.year)).set(doc); }
  catch (err) { b.disabled = false; b.textContent = "Ajouter"; showListError(err); }
});

function prompt(q) {
  return `Tu es une base de données de films. L'utilisateur cherche : "${q.replace(/"/g, "'")}".
Donne au maximum 6 longs métrages ou documentaires QUI EXISTENT (pas de séries) qui correspondent le mieux à cette recherche, le plus probable en premier.
N'inclus que des films dont tu es sûr qu'ils existent et dont tu connais les informations. N'invente jamais de film. Si rien ne correspond, renvoie une liste vide.
Réponds uniquement avec un tableau JSON, chaque élément :
{"title": titre français tel que connu en France, "originalTitle": titre original, "year": année de sortie (nombre), "director": réalisateur(s), "runtime": durée en minutes (nombre ou null), "country": pays d'origine en français, "genres": [max 3 genres en français], "cast": [max 4 acteurs principaux], "synopsis": 1-2 phrases en français sans spoiler, "imdbId": identifiant IMDb comme "tt0816692" seulement si tu en es sûr, sinon null}`;
}

let ctl = null;
async function search(q) {
  q = q.trim(); if (!q) return;
  const st = $("#searchStatus"); st.hidden = false; st.classList.remove("err");
  if (!sample) { st.classList.add("err"); st.textContent = "La recherche fonctionne seulement si tu ouvres cette page sur claude.ai et autorises Claude."; return; }
  ctl?.abort(); ctl = new AbortController();
  $("#searchBtn").disabled = true;
  st.textContent = "Recherche des films…";
  results = []; renderResults();
  try {
    const data = await sample.json(prompt(q), { signal: ctl.signal, effort: "low" });
    results = (Array.isArray(data) ? data : []).filter((r) => r && r.title && r.year).slice(0, 6);
    st.textContent = results.length ? `${results.length} ${results.length === 1 ? "film trouvé" : "films trouvés"} pour « ${q} ».` : `Aucun film existant trouvé pour « ${q} ». Vérifie l'orthographe ou essaie le titre original.`;
    renderResults();
  } catch (e) {
    if (e.code === "cancelled") return;
    st.classList.add("err");
    st.textContent = {
      not_granted: "La recherche a besoin de ton autorisation pour utiliser Claude. Ouvre le menu de cette page pour l'autoriser.",
      sampling_disabled: "Claude n'est pas disponible pour ce compte, la recherche ne fonctionne donc pas ici.",
      rate_limited: "Trop de recherches d'un coup. Attends une minute et réessaie.",
      session_expired: "Tu es déconnecté. Reconnecte-toi sur claude.ai.",
      invalid_json: "La réponse était illisible. Réessaie.",
    }[e.code] || "La recherche a échoué. Réessaie.";
  } finally { $("#searchBtn").disabled = false; }
}
$("#searchForm").addEventListener("submit", (e) => { e.preventDefault(); search($("#q").value); });
$("#suggest").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  $("#q").value = b.textContent; search(b.textContent);
});

/* ---------- démarrage ---------- */
renderTabs(); renderList();
(async () => {
  const [d, s, u] = await Promise.all([claude.use("db"), claude.use("sample"), claude.use("user")]);
  db = d; sample = s;
  const st = $("#listStatus");
  if (u) { const w = await u.can("data.write"); if (w === false) canWrite = false; }
  if (!db) { st.textContent = "Connecte-toi sur claude.ai pour voir et tenir ta liste."; return; }
  if (!canWrite) $("#suggest").hidden = true;
  const timer = setTimeout(() => { st.hidden = false; st.textContent = "Ta liste n'est pas encore accessible. Vérifie ta connexion."; }, 10000);
  db.collection("movies").onSnapshot((snap) => {
    films = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); st.hidden = !(!canWrite); st.classList.remove("err"); if (!canWrite) st.textContent = "Tu consultes cette liste en lecture seule ; seul le propriétaire peut la modifier."; }
    renderList(); renderResults();
  }, (err) => {
    clearTimeout(timer); st.hidden = false; st.classList.add("err");
    st.textContent = "Impossible de charger ta liste. Recharge la page plus tard.";
  });
})();
</script>
